# `resultado_30d` lo escribe `scripts/resultado_30d.rb`. Hasta el 2026-09-05 estaba
# SIEMPRE vacio y nadie lo escribia ni lo leia, que es un campo que miente por
# omision: alguien podia leer el null como «no hubo alcance» en vez de «no se midio
# nunca». Ahora la distincion es visible, porque un vacio significa una de estas
# tres cosas y el propio script las nombra al correr:
#   - la publicacion aun no cumple 30 dias;
#   - su plataforma no da contadores publicos sin autenticacion (dev.to, Medium,
#     LinkedIn), y ahi el campo se queda vacio a proposito;
#   - la consulta fallo, y entonces el script sale 1.
#
# Mide la RAIZ del hilo, no la respuesta: el hilo es raiz ES + respuesta EN, y
# sumarlas daria un numero que no corresponde a ninguna audiencia. La URL de la
# respuesta queda en `url_publicada_en`.
#
# No es un gate y no corre en CI: sale a la red.
