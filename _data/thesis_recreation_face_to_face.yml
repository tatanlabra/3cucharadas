locales:
  es:
    id: evidencia-cara-a-cara
    eyebrow: Auditoría visual
    title: La evidencia, cara a cara
    intro: Seis contrastes con su resultado medido y el límite que no conviene maquillar.
    instructions: Desliza, usa las flechas o presiona Inicio, Fin, ← y →. No hay avance automático.
    enlarge: Ampliar
    open_full_size: Ver a tamaño completo
    controls_label: Controles del carrusel
    pagination_label: Elegir contraste
    previous: Contraste anterior
    next: Contraste siguiente
    go_to: Ir al contraste
    of: de
    status_template: Contraste %current% de %total%
    limit_label: "Límite:"
    slides:
      - id: table-04-exact
        case: TABLE-04 · J-017
        title: Cuadro 4 · movilidad por quintil
        verdict: "Acerté: 12 de 12"
        tone: match
        metric: 12/12 celdas; N=955
        evidence: La tesis y la reejecución de Stata 17 contienen el mismo vector completo, no sólo el mismo total.
        limit: El calce actual no recupera la sesión histórica de 2014.
        original_label: Tesis publicada (2014)
        recreated_label: Reejecución actual (Stata 17)
        original_alt: Facsímil del Cuadro 4 de la tesis con las doce celdas y total 955.
        recreated_alt: Tabla reconstruida que reproduce exactamente las doce celdas del Cuadro 4.
        original_asset: s01-original
        recreated_asset: s01-es
      - id: figure-01-pattern
        case: FIGURE-01
        title: Figura 1 · quién entra y quién sale
        verdict: La conclusión sobrevivió
        tone: survived
        metric: Mismo patrón sectorial; totales distintos
        evidence: La expansión se concentra en particulares subvencionados y la destrucción en municipales en ambos lados.
        limit: Es un calce de patrón, no igualdad de alturas ni de totales.
        original_label: Tesis publicada (2014)
        recreated_label: Serie reconstruida
        original_alt: Facsímil de la Figura 1 con barras apiladas anuales por dependencia.
        recreated_alt: Barras reconstruidas de entradas y salidas acumuladas por dependencia entre 1993 y 2012.
        original_asset: s02-original
        recreated_asset: s02-es
      - id: figure-11-hhi
        case: FIGURE-11
        title: Figura 11 · concentración y movilidad
        verdict: Me equivoqué en 2014
        tone: past-error
        metric: La escala publicada del IHH y su umbral eran incorrectos
        evidence: Recalculado en escala 0–10.000, el umbral de 2.500 y la pendiente quedan visibles sobre 336 comunas.
        limit: La pendiente es asociacional; no demuestra que la concentración cause movilidad.
        original_label: Tesis publicada (2014)
        recreated_label: Reconstrucción con escala corregida
        original_alt: Facsímil de la Figura 11 con IHH en una escala de cero a cien.
        recreated_alt: Dispersión reconstruida de IHH comunal en escala cero a diez mil y movilidad anual.
        original_asset: s03-original
        recreated_asset: s03-es
      - id: figure-02-rates
        case: FIGURE-02 · J-010
        title: Figuras 2 y 3 · movilidad, creación y destrucción
        verdict: Recreación exacta
        tone: match
        metric: 80/80 y 40/40 puntos; medias 6,342 · 4,454 · 1,616
        evidence: Las fórmulas preservadas usan stock rezagado para movilidad bruta y destrucción; la creación usa el stock contemporáneo.
        limit: Las variantes del panel amplio son sensibilidad a universo y denominador, no sustituyen el estimando del productor.
        original_label: Tesis publicada (2014)
        recreated_label: Recreación canónica (2026)
        original_alt: Facsímil de la Figura 2 con tasas relativas por dependencia.
        recreated_alt: Movilidad bruta por dependencia y tasas totales de creación y destrucción, recreadas desde las fórmulas del productor.
        original_asset: s04-original
        recreated_asset: s04-es
      - id: table-08-rounding
        case: TABLE-08 · J-020
        title: Cuadro 8 · doce magnitudes
        verdict: Parece que truncé ocho valores
        tone: tentative
        metric: 12/12 compatibles; 4/12 redondean igual
        evidence: Las doce magnitudes están cerca, pero ocho caen en el dígito inferior al que produciría el redondeo convencional.
        limit: Truncamiento es la mejor hipótesis actual, no una ejecución histórica observada.
        original_label: Tesis publicada (2014)
        recreated_label: Reejecución Stata 17 y regla de redondeo
        original_alt: Facsímil completo del Cuadro 8 con efectos fijos, varianzas, N y grupos.
        recreated_alt: Comparación de doce magnitudes publicadas y reejecutadas, con cuatro redondeos iguales y ocho compatibles con truncamiento.
        original_asset: s05-original
        recreated_asset: s05-es
      - id: figure-04-net-mobility
        case: FIGURE-04 · J-028
        title: Figura 4 · movilidad neta
        verdict: Recreación exacta
        tone: match
        metric: 80/80 puntos de entradas menos salidas
        evidence: La planilla productora y el vector incrustado en el manuscrito coinciden punto por punto para las cuatro series.
        limit: El calce numérico no prueba que el ciclo macroeconómico cause los movimientos descritos en la prosa.
        original_label: Tesis publicada (2014)
        recreated_label: Serie regenerada
        original_alt: Facsímil de la Figura 4 con movilidad neta anual por dependencia.
        recreated_alt: Serie regenerada de entradas menos salidas por dependencia entre 1993 y 2012.
        original_asset: s06-original
        recreated_asset: s06-es

  en:
    id: face-to-face-evidence
    eyebrow: Visual audit
    title: The evidence, face to face
    intro: Six contrasts, each with a measured result and a limit that should not be airbrushed away.
    instructions: Swipe, use the arrows, or press Home, End, ← and →. Nothing advances automatically.
    enlarge: Enlarge
    open_full_size: View full size
    controls_label: Carousel controls
    pagination_label: Choose a contrast
    previous: Previous contrast
    next: Next contrast
    go_to: Go to contrast
    of: of
    status_template: Contrast %current% of %total%
    limit_label: "Limit:"
    slides:
      - id: table-04-exact
        case: TABLE-04 · J-017
        title: Table 4 · mobility by quintile
        verdict: "I got it right: 12 of 12"
        tone: match
        metric: 12/12 cells; N=955
        evidence: The thesis and the Stata 17 rerun contain the same complete vector, not merely the same total.
        limit: A present-day match does not recover the historical 2014 session.
        original_label: Published thesis (2014)
        recreated_label: Present-day rerun (Stata 17)
        original_alt: Facsimile of thesis Table 4 with all twelve cells and total 955.
        recreated_alt: Reconstructed table exactly reproducing all twelve cells in Table 4.
        original_asset: s01-original
        recreated_asset: s01-en
      - id: figure-01-pattern
        case: FIGURE-01
        title: Figure 1 · who enters and who exits
        verdict: The conclusion survived
        tone: survived
        metric: Same sector pattern; different totals
        evidence: In both panels, expansion concentrates in subsidised private schools and destruction in municipal schools.
        limit: This is a pattern match, not equality of heights or totals.
        original_label: Published thesis (2014)
        recreated_label: Reconstructed series
        original_alt: Facsimile of Figure 1 with annual stacked bars by school sector.
        recreated_alt: Reconstructed bars of cumulative entries and exits by sector from 1993 to 2012.
        original_asset: s02-original
        recreated_asset: s02-en
      - id: figure-11-hhi
        case: FIGURE-11
        title: Figure 11 · concentration and mobility
        verdict: I was wrong in 2014
        tone: past-error
        metric: The published HHI scale and threshold were wrong
        evidence: Recomputed on the 0–10,000 scale, the 2,500 threshold and slope are visible across 336 municipalities.
        limit: The slope is associational; it does not show that concentration causes mobility.
        original_label: Published thesis (2014)
        recreated_label: Reconstruction with corrected scale
        original_alt: Facsimile of Figure 11 with HHI displayed on a zero-to-one-hundred scale.
        recreated_alt: Reconstructed scatterplot of municipal HHI on a zero-to-ten-thousand scale and annual mobility.
        original_asset: s03-original
        recreated_asset: s03-en
      - id: figure-02-rates
        case: FIGURE-02 · J-010
        title: Figures 2 and 3 · mobility, creation, and destruction
        verdict: Exact reconstruction
        tone: match
        metric: 80/80 and 40/40 points; means 6.342 · 4.454 · 1.616
        evidence: The preserved formulas use lagged stock for gross mobility and destruction; creation uses contemporaneous stock.
        limit: Broad-panel variants are sensitivity checks for universe and denominator, not substitutes for the producer's estimand.
        original_label: Published thesis (2014)
        recreated_label: Canonical reconstruction (2026)
        original_alt: Facsimile of Figure 2 with relative rates by school sector.
        recreated_alt: Gross mobility by sector and total creation and destruction rates reconstructed from the producer formulas.
        original_asset: s04-original
        recreated_asset: s04-en
      - id: table-08-rounding
        case: TABLE-08 · J-020
        title: Table 8 · twelve magnitudes
        verdict: I appear to have truncated eight values
        tone: tentative
        metric: 12/12 practically compatible; 4/12 round identically
        evidence: All twelve magnitudes are close, but eight fall on the lower digit than conventional rounding would produce.
        limit: Truncation is the best current hypothesis, not an observed historical execution.
        original_label: Published thesis (2014)
        recreated_label: Stata 17 rerun and rounding rule
        original_alt: Full facsimile of Table 8 with fixed effects, variances, N, and groups.
        recreated_alt: Comparison of twelve published and rerun magnitudes, with four equal roundings and eight consistent with truncation.
        original_asset: s05-original
        recreated_asset: s05-en
      - id: figure-04-net-mobility
        case: FIGURE-04 · J-028
        title: Figure 4 · net mobility
        verdict: Exact reconstruction
        tone: match
        metric: 80/80 entry-minus-exit points
        evidence: The producer workbook and the vector embedded in the manuscript match point by point for all four series.
        limit: Numeric agreement does not show that the macroeconomic cycle caused the movements described in the prose.
        original_label: Published thesis (2014)
        recreated_label: Regenerated series
        original_alt: Facsimile of Figure 4 with annual net mobility by school sector.
        recreated_alt: Regenerated series of entries minus exits by sector from 1993 to 2012.
        original_asset: s06-original
        recreated_asset: s06-en
