  alt:
    es: Cuatro plataformas separadas —memoria de trabajo, correo personal sellado bajo una cúpula de cristal, índice
      de tesis y proyección pública— con una membrana translúcida que solo deja pasar tres salidas permitidas hacia
      la esfera central.
  advertencias:
  - 'No usar como teaser: a tamaño tarjeta las cuatro etiquetas quedan ilegibles y la membrana se lee como un artefacto.'
  - La escena es deliberadamente NO cerebral. El post argumenta que lo que hay es un registro de trabajo con procedencia,
    no cognición, y el teaser del Post II era un cerebro holográfico.
  - 'La esfera se ve hueca a propósito: la proyección pública es derivada, no la cosa misma.'
