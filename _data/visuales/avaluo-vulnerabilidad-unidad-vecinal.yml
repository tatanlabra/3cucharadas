# Manifest de activos visuales del post.
#
# Se escribe A MANO. Nunca se deriva del post: si se dedujera de él heredaría sus
# errores en vez de detectarlos, que es justo lo contrario de lo que se busca.
# El post es lo que se verifica; este archivo es contra qué se verifica.
#
# Lo valida scripts/verify_visual_assets.rb (gate de CI). Campos:
#   rol       hero | teaser | og | figura | social | carrusel
#   estado    publicable    → se sirve y puede referenciarse desde el post
#             solo-difusion → se versiona pero no se sirve; solo para subir a redes
#             bloqueado     → no debe publicarse. `motivo` explica por qué.
#                             Puede no tener `archivo` si la pieza ya se eliminó.
#   origen    ia-externa | datos | d2 | render-script | manual
#   cifras    deben aparecer literalmente en el cuerpo del post
#
# El razonamiento editorial (por qué el teaser sin texto funciona mejor en la
# portada, el orden de implementación) vive en source/readme.md, no acá.

slug: avaluo-vulnerabilidad-unidad-vecinal
ref: avaluo-vulnerabilidad-uv
posts:
  - _posts/2026-07-26-avaluo-vulnerabilidad-unidad-vecinal.md
  - _posts/2026-07-26-avaluo-vulnerabilidad-unidad-vecinal-en.md

piezas:
  # --- Piezas generadas con IA externa (paleta ai-generada) ---
  - id: hero
    rol: hero
    archivo: assets/images/avaluo-vulnerabilidad-unidad-vecinal/hero-avaluo-vulnerabilidad-1600x900.webp
    ancho: 1600
    alto: 900
    estado: publicable
    origen: ia-externa
    alt:
      es: "Un mismo avalúo fiscal de 9,4 millones de predios se divide por hogares, personas y metros cuadrados, y produce tres lecturas territoriales distintas."
    cifras: ["9,4", "19,9%", "45,8%"]
    advertencias:
      - "Los tres paneles ilustran la idea de que el patrón cambia con el denominador; no son un resultado del cruce."
      - "No usar como teaser pequeño: al reducirse a tarjeta sus textos quedan ilegibles."

  - id: og
    rol: og
    archivo: assets/images/avaluo-vulnerabilidad-unidad-vecinal/og-avaluo-vulnerabilidad-1200x630.webp
    ancho: 1200
    alto: 630
    estado: publicable
    origen: ia-externa
    alt:
      es: "Avalúo fiscal y vulnerabilidad territorial: tres denominadores, tres mapas."
    advertencias:
      - "Reencuadre manual desde el hero, no recorte ciego: un recorte centrado corta el titular y la figura derecha."

  - id: teaser
    rol: teaser
    archivo: assets/images/teasers/teaser-avaluo-vulnerabilidad.webp
    ancho: 1280
    alto: 720
    estado: publicable
    origen: ia-externa
    alt:
      es: "Mosaico territorial sin texto incrustado, usado como tarjeta del post en la portada."
    advertencias:
      - "Vive en la carpeta compartida assets/images/teasers/, no bajo el slug: la portada agrupa los teasers de todos los posts."
      - "Sin texto incrustado a propósito, para que el título del post no aparezca duplicado sobre la tarjeta."

  - id: teaser-640
    rol: teaser
    archivo: assets/images/teasers/teaser-avaluo-vulnerabilidad-640.webp
    ancho: 640
    alto: 360
    estado: publicable
    origen: ia-externa
    alt:
      es: "Derivado 640px del teaser, para listados y miniaturas."

  - id: figura-numerador
    rol: figura
    archivo: assets/images/avaluo-vulnerabilidad-unidad-vecinal/figures/numerador-tres-denominadores-1200x900.webp
    ancho: 1200
    alto: 900
    estado: publicable
    origen: ia-externa
    alt:
      es: "Un mismo numerador dividido por tres denominadores distintos produce tres ordenamientos territoriales."
    advertencias:
      - "Esquema conceptual: ilustra la mecánica del denominador, no un resultado calculado."

  - id: figura-bivariado
    rol: figura
    archivo: assets/images/avaluo-vulnerabilidad-unidad-vecinal/figures/bivariado-clasificacion-4x2-1200x1685.webp
    ancho: 1200
    alto: 1685
    estado: publicable
    origen: ia-externa
    alt:
      es: "Esquema conceptual de una clasificación bivariada que cruza cuartiles IGVUST con avalúo fiscal por metro cuadrado."
    advertencias:
      - "Reemplaza a la pieza bloqueada `figura-bivariado-v1`: es la versión corregida, sin minimapas y con la orientación 4 filas x 2 columnas del post."
      - "Los cuartiles IGVUST ordenan unidades vecinales; no son tramos iguales del índice."

  - id: figura-bivariado-v1
    rol: figura
    estado: bloqueado
    origen: ia-externa
    # Sin `archivo`: la pieza se eliminó del repo. Se conserva la entrada porque
    # el catálogo de errores es el activo, no el archivo.
    motivo: |
      Cuatro errores factuales detectados en revisión humana antes de publicar:
      1. Decía «CATÁSTRO»; debe decir «CATASTRO».
      2. Expandía IGVUST como «Índice Geográfico de Vulnerabilidad Urbana y Social
         Territorial»; el post lo define como «Índice Global de Vulnerabilidad
         Socioterritorial».
      3. Mostraba 4 columnas de vulnerabilidad x 2 filas de avalúo; el post describe
         4 filas IGVUST x 2 columnas de avalúo. Misma combinación, orientación invertida.
      4. Incluía minimapas ilustrativos que se leían como geometrías reales.
      La escala IGVUST además quedó invertida. Se sustituyó por `figura-bivariado`.

