contract: avaluos-ii-polish-20260910
authorization: 'Usuario: implementar ajustes de relato, carga, diseño y análisis con subagentes; preparación local previa a público.'
baseline:
  blog_commit: e986f238
  analysis_commit: 32c6fa3
  desktop_metric_grid_1440px_height: 495.28125
  mobile_metric_grid_390px_height: 1241.5
  map_measurement: Chile frío 2342 ms; recarga 1099 ms; comunas.json dos peticiones.
skills:
