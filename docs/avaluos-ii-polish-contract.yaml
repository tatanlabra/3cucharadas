provider_plan: Codex principal y tres tareas acotadas de datos, rendimiento y relato; sin afirmar independencia entre proveedores.
hard_constraints:
- No push, publicación, microdatos públicos ni modificación de fuentes crudas.
- Hogar, vivienda, rol y contribución no son unidades intercambiables.
- La composición del residuo es un escenario transferido desde viviendas observadas; no prueba calidad de las ausentes.
- Avalúos registrados altos no identifican probabilidad de tributar ni impuesto omitido de predios no enlazados.
- Caché acotada y con invalidación; fallos reintentables; sin precarga nacional de shards ni nuevos servicios globales.
- Animación finita, valor final accesible inmediato, sin movimiento con reduced-motion.
- Los mapas nuevos distribuyen imágenes raster; no archivos vectoriales, roles, direcciones ni identificadores de campamentos.
objective_judge:
  ideal: Lectura inmediata, gráficos legibles y mapas listos antes de uso, con enlace censal-predial observado.
  feasible: Mejorar carga y claridad en arquitectura actual; inferencia sólo como sensibilidad por falta de enlace.
  criteria:
  - latencia_medida
  - solicitudes_deduplicadas
  - menor_altura_sin_perder_legibilidad
  - contraste_AA
  - paridad_ES_EN
  - aritmetica_reproducible
  tie_break:
  - menor_superficie
  - reversibilidad
  - trazabilidad
  - accesibilidad
  - costo_operativo
tasks:
  F9_1:
    requirement: Escenario de materialidad y contexto de avalúo H
    owner: materiality_analysis
    output: catastros_sii/v5_brecha/artifacts/fiscal_gap y método
    acceptance: PYTHONPATH=v5_brecha/src python -m pytest v5_brecha/tests -q; build y auditoría de fuentes concilian 346 comunas.
    evidence: 53 pruebas analíticas verdes; build y source audit reconstruidos; escenario aceptable 1.318.681,81; 346 comunas. Véase docs/avaluos-ii-polish-evidence.md.
    falsified_by: Tres casos de no respuesta reprodujeron en rojo la clasificación anterior; recuperación corrige 73.338 a 72.642 sin cambiar
      brecha ni campamentos.
    rollback: Retirar campos nuevos y reconstruir snapshot anterior; conservar sensibilidad de campamentos.
  F9_2:
    requirement: Carga visible y eficiente de mapas
    owner: viewer_performance
    output: Módulos TS de carga/caché y mediciones cold/warm
    acceptance: >-
      Tests de fallos/reintento/evicción verdes y 343 comunas disponibles. Para cerrar rapidez global:
      medir navegación al primer estado útil MapLibre idle con loaded, teselas listas, cámara inmóvil
      y 343 comunas, con igual estilo/capas, encuadre final, viewport, caché, red y perfil de navegador;
      al menos tres cargas nuevas y dos recargas por versión. La mediana fría debe bajar al menos 10%
      frente al baseline emparejado, sin empeorar más de 10% selector o recarga y sin fallos ocultos.
      Evaluar con el protocolo fijado antes de medir en docs/catastro-paired-loading-20260911-protocol.json
      (ecc5800a). El evento load inicial se conserva como secundario: las cámaras en ese punto difieren.
      El margen es un criterio operativo acotado; no demuestra significación estadística ni optimalidad global.
    evidence: >-
      docs/catastro-paired-loading-20260911-focus.md y attempt3.json: diez observaciones válidas,
      dos cebados y dos exclusiones por foco conservadas. Mapa útil frío 2002,20 a 1593,10 ms (-20,43%);
      recarga 1668,10 a 1077,45 ms (-35,41%); selector mejora en ambas condiciones, cámaras/capas equivalentes.
      Primer load frío mejora sólo 6,72%, insuficiente por sí solo para el umbral del 10%.
      Once pruebas del evaluador verdes; código cartográfico actual idéntico al candidato 6b46731e.
    criterion_clarification: >-
      El resumen anterior decía MapLibre load; se sincroniza con la definición de mapa útil que el protocolo
      original ya fijaba antes de obtener datos. Se conservan umbrales y resultados adversos, incluida la
      menor mejora de load. No se elige una métrica nueva después de observar el resultado.
    falsified_by: 'Motor abortado: selector sobrevive; import fallido exige recarga. Dos fixtures de accesibilidad fallaron en integral; corregidos
      con eventos reales y 11 pruebas verdes.'
    rollback: Restaurar módulos de carga al baseline sin tocar datos.
  F9_3:
    requirement: Relato didáctico y bibliografía
    owner: editorial_inference
    output: Borradores ES/EN y referencias verificadas
    acceptance: Build drafts verde; cifras coinciden con artefacto; cada inferencia declara supuesto y refutación.
    evidence: Borradores ES/EN construidos con --drafts --unpublished y verificados; cifras, tablas, fuentes y enlaces al visor concilian. docs/avaluos-ii-editorial-evidence.md.
    falsified_by: Composición transferida se descarta si el parque residual difiere del observado; avalúos altos no demuestran obligación exigible
      sin enlace predial.
    rollback: Restaurar borradores al baseline.
  F9_4:
    requirement: Diagramación compacta; animación secuencial cerca del viewport, reducida a medio segundo por petición del 11-09; paleta clara con tonos próximos al nocturno.
    owner: root
    output: Proyección, barra triple, CSS, animación de cifras
    acceptance: TS/CSS/tests/build verdes; QA 390/1440 px claro/oscuro, reduced-motion y sin JS; tabla equivalente completa.
    evidence: 132 pruebas TS verdes en validación integral; casino 9/9 y máximo una cifra animada observado; petición posterior del 11-09 reduce 850–1090 a 425–545 ms, con prueba roja previa y nueve verdes después. Claro/oscuro 390/1440
      px; anexo axe cero infracciones e inconclusos en claro; tablas estáticas con 346 filas; 320 px sin overflow. docs/avaluos-ii-polish-evidence.md.
    falsified_by: 'Baseline carecía API de cifras: cuatro pruebas rojas. Paleta clara luminosa requiere contorno contrastante: no se conserva
      la afirmación anterior de contraste del relleno.'
    rollback: Restaurar UI al baseline y regenerar proyección.
  F9_5:
    requirement: Integración y preparación local
    owner: root
    dependencies:
    - F9_1
    - F9_2
    - F9_3
    - F9_4
    - F9_6
    - F9_7
    - F9_8
    acceptance: verify_fiscal_gap.py y validate_build.sh verdes; commits locales revisados; preview 4004 comprobado en host.
    evidence: >-
      docs/avaluos-ii-final-closeout-20260911.md y log final: validate_build.sh con Node 26.8.1,
      tipos/CSS, 132 pruebas Catastro, 52 Python sin omisiones, Vite/Jekyll y artefacto verdes;
      tres pruebas de Memoria Gobernada y 53 analíticas aprobadas. Verificación fiscal y 99 assets verdes.
      F9_2 cumple el protocolo emparejado del mapa útil. Vitest 4.1.11 corrige la alerta de desarrollo;
      auditoría npm final cero vulnerabilidades, los 16 archivos del bundle Catastro conservan sus hashes.
      Preview 4004 comprobado desde el host; evidencia y commits locales, sin push.
    falsified_by: 'SHA esperado de PNG alterado en copia temporal: verificador rechaza; artefactos reales recuperan verde. Dos fixtures deficientes
      fallaron antes de corregirse.'
    rollback: Revertir commits locales propios, conservar fuentes y evidencias.
  F9_6:
    requirement: Hover de Chile sin cambios aleatorios de altura.
    owner: viewer_performance
    output: 'app.ts: texto territorial separado de acción; CSS con reserva flexible.'
    acceptance: Comparar altura de las 343 etiquetas a 1280 y 390 px; conservar nombres completos y acción de teclado; sin overflow.
    evidence: Baseline Teno 187,78 vs Quinta de Tilcoco 203,50 px. Final las 343 etiquetas conservan 223,656 px a 1280 y 404,156 px a 390; nombre
      y región completos.
    falsified_by: Un nombre que desborde la reserva o una acción que vuelva a la primera fila reabre el criterio.
    rollback: Restaurar únicamente copy y estilos del status.
  F9_7:
    requirement: Definir código H una vez; después usar predios o roles habitacionales.
    owner: root_and_editorial_inference
    output: Visor, gráficos estáticos/dinámicos y borradores ES/EN.
    acceptance: 'Inspección de texto renderizado: una definición del código por página; cifras y claves técnicas preservadas.'
    evidence: Visor renderizado con una sola mención del código H; artículos con una definición por idioma; componentes, gráficos y método prefieren
      habitacionales. Cifras y claves técnicas preservadas.
    falsified_by: Repeticiones públicas de roles/predios H después de la definición o alteraciones de campos técnicos.
    rollback: Revertir sólo cambios de terminología.
  F9_8:
    requirement: Dos mapas con predios habitacionales, unidades vecinales y campamentos para las mayores brechas restantes.
    owner: materiality_analysis
    output: Renderer reproducible y PNG de Valparaíso y Puerto Montt; incorporación al anexo del visor.
    acceptance: Plantilla histórica identificada; fuentes/cortes/hashes documentados; tres capas visibles, escala y ubicación del recorte; sin
      identificadores.
    evidence: 'Dos mapas en PNG claro/oscuro, 1800×1350, capas y hashes comprobados. Previews WebP 900/1800 px: móvil ~98 KB frente a PNG 1–1,2
      MB; carga diferida y sólo variante visible. maps-audit.json y método conservan recortes, faltantes y procedencia.'
    falsified_by: CUT ajeno al top2 sólo en memoria causa ValueError antes de crear salida; SHA de PNG alterado en copia temporal también rechazado;
      renderer real y verificador final verdes.
    rollback: Retirar los dos PNG y su bloque HTML; conservar anexo anterior y fuentes locales.
  F9_E1:
    requirement: Resolver la alerta moderada de Vitest observada durante el cierre integral.
    owner: root
    scope: package.json y package-lock.json; sólo familia Vitest 4.1.10 a 4.1.11.
    acceptance: npm audit sin la alerta; suites que comparten Vitest y gate integral verdes; bundle de producción sin cambios.
    evidence: >-
      docs/avaluos-ii-dependency-audit-20260911.json registra dos paquetes afectados por GHSA-82fw-gwwq-j7x9;
      docs/avaluos-ii-dependency-audit-20260911-after.json registra cero vulnerabilidades.
      Log final acredita 135 pruebas Vitest y build; docs/avaluos-ii-dependency-scope-20260911.json
      registra el alcance y hashes idénticos de los 16 archivos Catastro.
    falsified_by: >-
      La auditoría inicial observó dos alertas. El primer install cambió además sourcemap-codec;
      la comprobación del alcance lo rechazó. Se restauró 1.5.5 y se repitió el gate sobre el lockfile final.
    rollback: Revertir sólo los dos manifiestos y ejecutar npm ci; reabre explícitamente la alerta de desarrollo.
