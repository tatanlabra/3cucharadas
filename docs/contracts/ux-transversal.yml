schema: ux-transversal-v1
# Invariantes de UX que valen para todo el sitio. Nacieron de la auditoría
# archivo/handoffs/2026-10-17_AUDITORIA_ux-ui-3cucharadas.md (capa 0) y las aprobó
# la persona usuaria punto por punto el 2026-10-17.
#
# Las verifica tests/test_ux_transversal_contract.py sobre el sitio construido, en
# el job build_site del CI. Cada `id` exige un método test_<id con guiones bajos>,
# así que agregar una invariante sin su prueba también reprueba.
#
# Cambiar un valor de aquí es una decisión de diseño, no un ajuste: se cambia el
# contrato y el test en el mismo commit, con la medición que lo justifica.
falsified_by: >-
  2026-10-17: las 7 pruebas de la capa 0 reprobaron contra el build de origin/main
  b1a3eaaa (antes de los cambios) y aprobaron con los cambios de la rama
  claude/ux-transversal-20261017; las 3 de movimiento se vieron rojas con su
  defecto inyectado (ver el commit que las agrega). Las 4 de la ronda high-end
  (avisos, entrada animada, minutos y objetivos del autor) reprobaron contra el
  build de origin/main 6543e912 y aprobaron con la rama claude/ux-highend-20261017. Las 3
  de la fase 1 de dirección visual (navegación, escala y tablas) reprobaron contra el
  build de origin/main 15929d70 y aprobaron con la rama claude/ux-fase1-20261017. La de
  anatomía del post reprobó contra e6b63368 y aprobó con claude/ux-fase2-20261017. La de
  portada reprobó contra 812d261a y aprobó con claude/ux-fase3-20261017. Las de
  botones y fechas reprobaron contra 989493dd y aprobaron con claude/ux-fase4-20261017. La de
  alineación título→párrafo reprobó contra 58b311d2 y aprobó con claude/ux-sangria-20261017. La de
  región única reprobó contra 782dfc47 y aprobó con claude/ux-region-unica-20261017. La de
  jQuery reprobó contra e912c92b y aprobó con claude/ux-capa2a-20261017. La de
  recursos versionados reprobó contra 6136d2e8 y aprobó con claude/ux-buscador-version-20261017. La de
  tokens reprobó contra 6da271a1 y aprobó con claude/ux-capa2b-20261017. La de
  Sass sin @import se vio roja con un @import y con un darken() global inyectados. La de
  ficha del autor reprobó contra 760944ee y aprobó con claude/ux-ficha-acerca-20261017. La de
  destacados reprobó contra 6948bcd0 y aprobó con claude/ux-destacados-20261017.
invariants:
  - id: theme-color-crema
    rule: En tema claro, la barra del navegador usa el fondo crema #faf7f0, no blanco.
    why: theme-toggle.js pisaba con #ffffff el valor correcto de head.html.
  - id: primera-visita-sistema
    rule: Sin elección guardada, la primera visita sigue prefers-color-scheme; el tema del sistema no se persiste como elección.
    why: con el sistema en oscuro el sitio abría en claro.
  - id: carrusel-nocturno-contraste
    rule: En academic-night, cada tono del carrusel de evidencia tiene un color de métrica con contraste >= 4,5:1 sobre su capa.
    why: los tonos base medían entre 2,08 y 2,65:1 sobre #262626.
  - id: medida-linea
    rule: Existe un único token --measure en ch (45-66), y toda regla de medida de la prosa de .page__content lo usa en vez de un valor literal.
    why: la prosa medía 85-87 caracteres por línea en tablet; con 62ch, 74.
  - id: pie-objetivos-tactiles
    rule: Los enlaces sociales del pie miden al menos 24 px de alto (WCAG 2.5.8).
    why: medían 14 px en móvil.
  - id: comentarios-h2
    rule: El título de la sección de comentarios es h2, al mismo nivel que «Puede que también te interese».
    why: saltaba de h2 a h4 en todos los posts.
  - id: relacionados-por-etiquetas
    rule: «Puede que también te interese» ordena por etiquetas compartidas (3, 2, 1) en el mismo idioma y completa con recientes.
    why: con lsi false mostraba los 4 más recientes; el Post II ponía su propia parte I en tercer lugar solo por fecha.
  - id: movimiento-accesible
    rule: Nada se oculta por defecto; .motion-pending solo lo pone JS bajo el pliegue y se anula con prefers-reduced-motion y al imprimir; el hover de tarjetas solo existe con hover:hover y sin movimiento reducido.
    why: la referencia (Nintendo) dejaba 123 de 123 bloques en opacity 0 hasta que corría el JS e ignoraba reduced-motion en el hover.
  - id: firma-tres-cucharadas
    rule: Todo post con tres títulos «Cucharada N»/«Spoonful N» los tiene con id, carga motion.js y el indicador tiene objetivos de al menos 24 px.
    why: el indicador enlaza a cada cucharada; sin id no hay destino y sin 24 px falla WCAG 2.5.8.
  - id: transicion-tarjeta-post
    rule: La declaración @view-transition va en línea en el head, condicionada a prefers-reduced-motion no-preference, y ninguna página repite un view-transition-name.
    why: desde main.css Chromium 152 ignoraba la declaración; un nombre repetido anula la transición entera.
  - id: identidad-cromatica
    rule: No quedan los colores de la skin contrast (#0000ff, #b60000) en el CSS compilado; enlaces #1f5f8b y acento navy #1b2a41, con contraste AA sobre el crema.
    why: la interfaz usaba el azul de navegador y el rojo de la skin, ajenos a la paleta aprobada de las portadas (C5).
  - id: fuentes-subconjunto
    rule: Las @font-face apuntan solo a los subconjuntos del manifiesto, sus sha256 coinciden y todo carácter usado en el sitio está cubierto (o tampoco existía en la fuente completa).
    why: los posts descargaban 2 MB de fuentes; FiraCode Nerd sola pesaba 1,1 MB sin que el código usara un glifo Nerd (C1).
  - id: iconos-autohospedados
    rule: Ninguna página carga Font Awesome desde cdnjs; todo ícono fa-* usado en el HTML o en el JS tiene su regla en fa-subset.css y sus archivos coinciden con el manifiesto.
    why: se descargaban ~315 KB de un tercero para 27 íconos (C2).
  - id: imagenes-responsivas
    rule: Toda <img> cuya fuente tiene variantes en _data/image_variants.json se publica con srcset que las incluye, y las variantes existen.
    why: figuras de hasta 2562 px se servían completas en huecos de 731 px (C3).
  - id: avisos-enlace-contraste
    rule: En citas y avisos de .page__content, todo enlace usa el enlace del sitio (--ui-link) y tiene contraste >= 4,5:1 sobre la superficie del aviso y sobre el papel, en los dos temas; la regla cubre cada variante de aviso.
    why: en Avalúos II el enlace #358ca7 quedaba a 3,07:1 sobre #343746 (U06).
  - id: sin-entrada-animada
    rule: La cabecera, el hero, #main y el pie no conservan la animación de entrada del tema; la última declaración animation que los alcanza es none.
    why: con prefers-reduced-motion la portada seguía con 4 animaciones activas (U20); quitarlas adelantó el LCP móvil 36 ms en la portada.
  - id: minutos-lectura-plural
    rule: El tiempo de lectura concuerda en número («1 minuto», «12 minutos») y ninguna página muestra «minuto(s)».
    why: todos los posts decían «N minuto(s) de lectura» (U16), y la división entera daba «1 minutos» entre 200 y 399 palabras.
  - id: autor-cabecera-objetivos-tactiles
    rule: Los enlaces del perfil del autor y el título del sitio miden al menos 24 px de alto (WCAG 2.5.8).
    why: medían 19 y 18 px en móvil (U14).
  - id: navegacion-en-linea
    rule: Desde 64em los enlaces de navegación se ven en línea y el botón «Menú» desaparece; bajo 64em sigue el panel plegado. Cada regla de 64em tiene el mismo selector que la que reemplaza, de modo que gana por orden y no por especificidad.
    why: a ningún ancho se veía una sección del sitio sin abrir el menú (U12); la versión anterior en línea había dejado el panel abierto por una guerra de especificidad.
  - id: escala-y-lectura-fina
    rule: Los títulos siguen una escala de razón 1,25 sobre el cuerpo (h4 1,125em, h3 1,25em, h2 1,5625em, h1 1,953em); el texto de avisos mide 0,875em del cuerpo, los pies de figura 0,8em y el índice no parte palabras con guion.
    why: h2 y h3 medían 1,25 y 1,125 veces el cuerpo; avisos y pies quedaban a 13,5 px y el índice a 12,4 px con «re-sidencial» y «diferen-cia».
  - id: tablas-leyenda-y-fondo
    rule: --fondo vale el fondo de la página y lo usan las sombras de .tabla-desliza; cada .tabla-desliza contiene su ancho y su leyenda mide el visor (100cqi) y queda fija al desplazar.
    why: 120 de 122 tablas tenían un parche casi blanco sobre el crema; 6 tablas se salían de la columna de texto y 6 leyendas se cortaban a mitad de frase en móvil.
  - id: anatomia-del-post
    rule: Todo post lleva firma compacta (avatar y nombre con enlace a «Acerca de») bajo su título, conserva la h-card del autor en el DOM y, desde 64em, la presenta después del artículo con la columna de texto centrada entre márgenes iguales al del índice.
    why: en escritorio la ficha del autor ocupaba la columna izquierda de cada post y descentraba la lectura; en móvil ya iba al final.
  - id: portada-ultima-cucharada
    rule: La página 1 de la portada (ES y EN) abre con el post visible más reciente de su idioma como hero, la grilla no lo repite, el único fetchpriority alto es el del hero y la ficha del autor con sus rel="me" sigue en la portada. La página 2 en adelante conserva el hero de marca.
    why: el hero era una marca genérica con dos botones; el contenido nuevo no tenía lugar propio, y la ficha lleva los rel="me" con que Mastodon, LinkedIn y Bluesky verifican el sitio.
  - id: botones-interaccion
    rule: Botones, controles, chips y paginación comparten un lenguaje: transición solo de color, fondo, borde, sombra y transformación (nunca `all`); anillo de foco de al menos 2 px; pulsación y elevación solo sin movimiento reducido, y la elevación solo con `hover: hover`; botones en píldora; «Compartir» monocromo con X; «Anterior / Siguiente» con el título del destino y sin enlaces deshabilitados falsos.
    why: convivían esquinas de 0, 4 y 999 px, el `transition: all` del tema, los colores de cada red social y un «Anterior / Siguiente» cuyo destino solo estaba en un `title` invisible en táctil.
  - id: fechas-en-idioma
    rule: Ninguna página en español muestra una fecha con el mes en inglés; las fechas en español se escriben «13 de septiembre de 2026».
    why: el filtro date de Liquid escribe %B en inglés y 15 páginas en español decían «Actualizado: September 13, 2026».
  - id: titulo-y-parrafo-alineados
    rule: La prosa directa de .page__content (p, ul, ol) no se centra con margen automático a la izquierda; arranca en el mismo borde que los títulos y el ancho extra queda a la derecha.
    why: en el Post II la prosa centrada a 62ch dejaba cada párrafo tras un subtítulo 88 px adentro a 1.440 px (14 de 14 pares), y la persona usuaria lo leía como una sangría.
  - id: tablas-region-unica
    rule: Cada tabla tiene una sola región enfocable (ninguna región envuelve a .tabla-desliza), ningún envoltorio fuerza `width:max-content`, toda región de tabla con leyenda se llama como su leyenda, y los includes sellados de Avalúos II siguen coincidiendo con su procedencia.
    why: en Avalúos II 7 de 12 tablas tenían dos paradas de tabulación (región del generador más región del plugin) y las 12 se anunciaban «Tabla desplazable horizontalmente N»; los generadores no se pueden tocar porque provenance.json sella sus salidas.
  - id: sin-jquery
    rule: Ninguna página carga main.min.js ni jQuery; el artefacto no publica main.min.js; site-core.js carga en todas las páginas con scripts y cubre «Seguir», buscador, índice activo, anclas, copiar código e imágenes ampliables con <dialog>; ningún JS propio usa jQuery; el desplazamiento suave existe solo sin movimiento reducido; el contador del buscador no usa «(s)».
    why: main.min.js pesaba 124 KB (42 KB con gzip) para seis comportamientos que la plataforma ya resuelve; site-core.js pesa 9,9 KB (3,4 KB con gzip).
  - id: recursos-versionados
    rule: Todo script y hoja de estilo local se enlaza con ?v=<build>, o con una versión o un hash en su propia ruta; ninguno queda con un nombre fijo que el borde o el navegador puedan servir viejo.
    why: el 2026-10-17, al retirar jQuery, Cloudflare siguió sirviendo el lunr-site.js anterior (sin versión, max-age 4 h) y el buscador falló en producción con «$ is not defined» hasta purgarlo; search-store.js arrastraba el mismo defecto con el índice de búsqueda.
  - id: tokens-de-interfaz
    rule: Los tokens --ui-* se definen en :root y se redefinen bajo academic-night; resueltos, tinta sobre papel y sobre superficie, enlace sobre superficie y texto fuerte sobre fondo fuerte cumplen 4,5:1 en los dos temas; compartir, paginación, etiquetas y chips usan solo tokens y no tienen reglas propias por tema.
    why: cada componente nuevo llevaba un par de reglas claro/oscuro con colores literales, y al chip le faltó la suya: en oscuro su borde era invisible y su texto al pasar el cursor quedaba en #123e5c sobre #161616.
  - id: sass-sin-import
    rule: La Sass del sitio no usa @import en ningún archivo (assets/css/main.scss ni _sass/**); el tema vive en _sass como módulos (@use/@forward) configurados con @use ... with; sin Susy, librería breakpoint ni Magnific Popup; solo el skin contrast que fija _config.yml; ni /en/assets/css/main.css huérfano; y el CI compila sin silenciar avisos (scripts/verify_sass_strict.rb) y reprueba ante cualquiera.
    why: con quiet_deps el build mostraba 4 avisos pero escondía 249 (166 de funciones globales, 54 de @import, 20 de if(), 6 de división y 3 de color), todos eliminados al migrar el tema a módulos; el CSS compilado conserva las 1.538 reglas, sin las 71 de Magnific, y 24 capturas en ambos temas no cambian.
  - id: destacados-del-tema
    rule: Citas y avisos, y lo que alojan (como el recuadro de auditoría del Post II), usan la superficie de cada tema (tokens --callout-*), no la de Dracula; la cita no tiene fondo ni sangría y arranca en el borde de la prosa; texto con 4,5:1 y acentos (por tipo y filete de cita) con 3:1 sobre su fondo, en los dos temas. El código conserva Dracula.
    why: los destacados eran un recuadro #343746 con filete morado #bd93f9 idéntico en ambos temas, una losa oscura en el tema claro y un tinte morado en una paleta nocturna de grises; la cita entraba 40 px respecto de la prosa (señalado por la persona usuaria en «Acerca de»).
  - id: ficha-autor-acerca
    rule: En la ficha del autor, la foto y el nombre llevan a «Acerca de» del mismo idioma (/about/ o /en/about/), no al inicio; la foto no repite la parada de tabulación del nombre y la h-card conserva u-url y rel="me".
    why: ambos llevaban al inicio, que ya está en el logo y el título de la cabecera; la persona usuaria pidió que lleven a «Acerca de» (2026-10-17).
  - id: prosa-justificada-tesis
    rule: En los Post I y II, en español e inglés, todo párrafo de prosa del cuerpo (hijo directo del contenido, antes de la primera regla horizontal que abre notas o referencias) lleva .text-justify, la misma marca de párrafo que usan los posts anteriores; solo quedan fuera las notas .small, las leyendas .table-caption y las referencias.
    why: el Post II tenía 25 de 49 párrafos de prosa justificados y el Post I 38 de 41, mientras los posts anteriores justifican el cuerpo completo; la persona usuaria notó el Post II sin justificar (2026-10-17).
