schema_version: 1
audit_id: thesis-post-ii-viewer-coordinate-audit-v1
observed_on: "2026-10-17"
scope:
  expected_rbds: [25077, 20428, 31422, 20440, 391, 390]
  expected_official_observations: 6
  method: >-
    Every public point used by the Post II viewer is retained as an official
    observation and compared with the frozen OSM education snapshot through
    institutional Nominatim. A candidate never overwrites the official point.
  limitations:
    - OSM objects can be retrospective and do not establish a historical location by themselves.
    - No candidate is evidence of absence from OSM, not validation of MINEDUC.
    - Name and commune agreement alone cannot distinguish distant homonyms.
