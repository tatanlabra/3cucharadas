schema_version: 2
audit_id: thesis-post-ii-viewer-coordinate-audit-v2
observed_on: "2026-10-17"
scope:
  expected_rbds: [391, 390]
  expected_official_observations: 2
  publication_rule: reviewed_and_flagged_primary_case_only
  method: >-
    Every point displayed for the El Salvador case is retained as a distinct
    observation and compared with the frozen OSM education snapshot through
    institutional Nominatim. A candidate never overwrites the official point.
  limitations:
    - OSM objects can be retrospective and do not establish a historical location by themselves.
    - Name, address and commune agreement do not prove identity or historical timing.
    - The targeted audit does not validate the unused systematic examples or the national directory.
