    rationale_es: El nombre y la calle Avenida Diego Portales son compatibles; el número 500 proviene de MINEDUC y no está geolocalizado en OSM. El objeto fue creado en 2022 y no declara RBD ni fuente contemporánea.
    rationale_en: The name and Avenida Diego Portales are compatible; number 500 comes from MINEDUC and is not geolocated in OSM. The object was created in 2022 and states neither an RBD nor a contemporaneous source.
