  inductive: "Cada gate nuevo o corregido debe observar un fallo pertinente y su recuperación verde."
  hard_constraints:
    - no_secret_or_private_data_exposure
    - no_unsupported_claim
    - no_regression_in_build_or_accessibility
    - no_external_action_without_human_authorization
  optimum: "Entre alternativas válidas, elegir menor superficie de cambio, mayor reversibilidad y evidencia más fuerte."
  verdict: "Un hard constraint rojo bloquea la fase aunque las demás métricas sean verdes."

