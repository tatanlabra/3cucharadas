decision:
  id: DEC-P2-001
  selected: public_story_plus_technical_note
  rationale: >-
    El relato principal debe responder preguntas de política pública en lenguaje común;
    identificadores de pipeline, cifras de sensibilidad y detalles de ejecución quedan en
    una nota técnica auditable. La decisión sustituye el gate literal por invariantes
    semánticos sin relajar límites causales ni trazabilidad.
