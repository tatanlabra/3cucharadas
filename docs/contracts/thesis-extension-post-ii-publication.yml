  base: origin/main@b2957178
  branch: release/thesis-post-ii-public-clean-20261012
  authorized_local_actions: [edit, test, research_commit, blog_commit, tailnet_preview, telegram_review_notice]
  external_actions: [tailnet_preview, telegram_review_notice]
  excluded: [push, deployment, dissemination]
invariants:
  - id: INV-01
    rule: ES y EN conservan identidad, cifras materiales, límites y visuales equivalentes.
  - id: INV-02
    rule: NOT_ESTIMABLE nunca se presenta como cero, empate ni prueba de peor desempeño.
  - id: INV-03
    rule: Ninguna asociación, descomposición o cercanía se presenta como efecto causal.
  - id: INV-04
    rule: Los identificadores de auditoría y decimales auxiliares no invaden el relato público.
  - id: INV-05
    rule: El release parte de origin/main y no incorpora la historia privada de Tailnet.
  - id: INV-06
    rule: El Salvador se presenta como caso autoral documentado, fuera de la selección sistemática y sin atribuir a la caída de matrícula un motivo administrativo no probado.
  - id: INV-07
    rule: RBD 390 es escuela receptora de una fusión y nunca se rotula como apertura.
  - id: INV-08
    rule: >-
      Las 2500 palabras son una meta editorial flexible, no un máximo contractual:
      excederla genera una advertencia informativa, nunca un rechazo, cuando la extensión
      aporta evidencia trazable, claridad didáctica o límites inferenciales necesarios.
  - id: INV-09
    rule: >-
      La auditoría geográfica publica solo agregados, conserva atribución OSM/ODbL,
      separa 12.038 establecimientos funcionando de 78 autorizados sin matrícula y no
      convierte candidatos en errores oficiales confirmados.
  - id: INV-10
    rule: >-
      Los dos casos sistemáticos son Lo Barnechea y Lo Prado bajo la spec v5; ni valores
      ni disponibilidad de resultados intervienen en su selección.
  - id: INV-11
    rule: Cada figura declara la fuente sustantiva correcta y la demografía base 2024 se atribuye a INE, no a MINEDUC.
  - id: INV-12
    rule: En escritorio la prosa directa no supera 72ch; el ancho adicional queda reservado para visuales, tablas y componentes técnicos.
  - id: INV-13
    rule: La secuencia pública es observación, diagnóstico y decisión; ninguna señal activa por sí sola cierre, fusión, apertura o ranking.
  - id: INV-14
    rule: Los SLEP actúan sobre su propia red y no se les atribuye autoridad sobre toda la oferta comunal.
  - id: INV-15
    rule: Falsos positivos, falsos negativos e IVE-SINAE agregado quedan visibles como salvaguardas de focalización.
  - id: INV-16
    rule: La teoría de cambio es una hipótesis evaluable y no evidencia de que la cadena produzca aprendizaje o equidad.
  - id: INV-17
    rule: El rechazo del control sintético SLEP por falta de soporte no se interpreta como efecto cero ni ausencia de efecto.
  - id: INV-18
    rule: La DDD SAE es exploratoria y causalmente bloqueada mientras cuatro regiones tratadas, posibles spillovers e intervalos imprecisos no permitan identificar un efecto.
  - id: INV-19
    rule: >-
      La AUC SLEP no distinguible del azar es ausencia de detección con tres predictores,
      no evidencia de calendario aleatorio; los márgenes SAE, más amplios que los
      intervalos de 2018, no acreditan tendencias paralelas útiles.
