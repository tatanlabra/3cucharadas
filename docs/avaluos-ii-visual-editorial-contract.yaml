contract: avaluos-ii-visual-editorial-20260911
phase: F11
objective: Entregar hero y teaser reales, coherentes con el artículo y diagnosticados por un subagente.
authorization: Petición explícita de generación directa y diagnóstico delegado de imagegen; preparación local sin
