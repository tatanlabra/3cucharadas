invariants:
- Las ilustraciones conceptuales no sustituyen mapas ni cifras reproducibles.
- Sin texto incrustado; título y descripción accesibles en HTML por idioma.
- Generación y reencuadre mediante image_gen integrado; sin fallback API.
- Conservar PNG originales; recodificación WebP sin cambios de píxeles RGB.
- No modificar la skill global ni publicar.
