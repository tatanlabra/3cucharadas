    impact: Las cifras, nombres, trayectorias, mapas y gates vigentes del blog ya no representan la salida preregistrada.
    repair: Tratar los artefactos actuales como obsoletos, actualizar todas las superficies en F7-F9 y no seleccionar ex post los casos anteriores.
