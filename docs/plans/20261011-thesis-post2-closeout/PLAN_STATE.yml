  - id: D-17
    observed: Tres suites visuales escribían doce artefactos versionados sobre la raíz y dejaban el freeze en rojo después de pasar sus propios tests.
    impact: Un gate verde contaminaba el candidato que pretendía validar.
    repair: Copiar inputs públicos a tmp_path_factory, renderizar allí y verificar cero cambios y cero mtimes alterados en la raíz.
