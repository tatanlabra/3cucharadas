  - id: G-VISUAL
    status: done
    red_probe: Forzar ancho, tamaño o contraste fuera de umbral debe producir exit distinto de cero.
    green: ES y EN, claro y oscuro, 390/1440/1920px cumplen tamaño, contraste y overflow.
  - id: G-ELSALVADOR
    status: done
    red_probe: Un RBD ambiguo, anexo, cierre no estricto o destino no documentado impide el claim fuerte.
    green: Identidad y cronología verificadas; cada afirmación conserva su clase epistémica.
  - id: G-ELSALVADOR-SEPARATION
    status: done
    red_probe: Añadir el caso al arreglo o al contador de la selección sistemática debe producir exit distinto de cero.
    green: Dos mapas permanecen sistemáticos y El Salvador aparece solo como caso autoral documentado.
  - id: G-COORDINATE-CAVEAT
    status: done
    red_probe: Alimentar la coordenada 2019 del RBD 390 debe fallar por incompatibilidad con localidad, dirección y distancia.
    green: El render usa la coordenada oficial 2020 y conserva la advertencia de procedencia.
  - id: G-LENGTH-FLEXIBILITY
    status: done
    red_probe: Una versión extensa con contenido trazable debe atravesar el verificador semántico y emitir post-above-soft-word-target.
    green: No existe máximo duro de palabras o caracteres; se conserva solo el mínimo contra truncamiento y la advertencia editorial.
  - id: G-PARITY
    status: done
    red_probe: Mutar 665 a 664, retirar el caso o insertar un campo público no autorizado debe fallar.
    green: ES y EN tienen multiconjuntos numéricos idénticos y ambos JSON pasan whitelists compartidas.
  - id: G-RELEASE
    status: active_pending_human_review
    red_probe: Un cambio posterior invalida hashes o recibos previos.
    green: Build limpio, artefacto, QA visual, revisión adversarial y aprobación humana actuales.

