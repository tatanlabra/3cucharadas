phases:
  - id: P0
    name: Gobierno y estado vivo
    status: done
    evidence: Este archivo reabre el contrato visual y registra tareas, derivas y límites de autoridad.
  - id: P1
    name: Integridad científica
    status: done
    evidence: Freeze científico revisión 4, quince pruebas, ocho canarios, Ruff y validador en verde; la transición de tres a dos casos sistemáticos quedó registrada.
  - id: P2
    name: Relato ES/EN y evidencia visual
    status: done
    evidence: Texto, mapa interactivo, carrusel y fallback OSM reparados; la regla publicada refleja familia educativa primero y no atribuye sustitución ni puntajes observables a Rancagua.
  - id: P3
    name: Rediseño responsivo del visor
    status: done
    evidence: Matriz de 24 páginas, 12 SVG y dos fallbacks en verde; axe-core obtuvo cero violaciones y cero inconclusos en el contenido ES y EN con viewport completo.
  - id: P4
    name: Caso El Salvador
    status: done
    evidence: >-
      Expediente trazable disponible: RBD 391 cerró y se fusionó con RBD 390;
      la BCN documenta el traslado de primero a sexto; MINEDUC aporta identidad,
      coordenadas y matrícula 2004-2025. La causa administrativa del cierre no está documentada.
  - id: P5
    name: Regeneración y paridad
    status: done
    evidence: >-
      El caso fue admitido como recuadro descriptivo propuesto por el autor, fuera de la
      selección sistemática. JSON, SVG, include, relato ES/EN y manifiestos fueron regenerados y validados.
  - id: P6
    name: Revisión adversarial
    status: done
    evidence: Claude R3 emitió REQUEST_CHANGES; F19 reparó las derivas y Claude Opus 5.5 reprodujo los cierres en solo lectura antes de emitir APPROVE.
  - id: P7
    name: Revisión humana y entrega externa
    status: blocked
    evidence: H1 usa el candidato limpio revisión 23; push, despliegue y difusión requieren instrucciones posteriores explícitas.
  - id: P8
    name: Uso de política y puente científico
    status: done
    evidence: Matriz bilingüe, claims esquema 2, revisión Claude APPROVE y candidato limpio con suite integral exit 0.
  - id: P9
    name: Búsqueda causal SLEP y SAE
    status: done
    evidence: >-
      SLEP v2 rechazó 25 de 25 comparaciones por falta de soporte; SLEP v3 estimó AUC 0,5341
      con p=0,2195 y 53 de 70 unidades de alto solapamiento; SAE DDD estimó HHI +0,003513
      y log del número efectivo -0,004192, ambos con intervalos que incluyen cero. Claude
      emitió ACCEPT_WITH_CAVEATS y Codex adjudicó M1-M3, L1-L12 y V1-V3 en la revisión 9.

