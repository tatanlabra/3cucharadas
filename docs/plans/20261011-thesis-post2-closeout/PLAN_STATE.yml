    status: repaired
  - id: D-08
    observed: El salto de matrícula de RBD 390 en 2014 es consistente con la fusión, pero no identifica destinos individuales.
    impact: No puede afirmarse que cada estudiante cerrado terminó en RBD 390.
    repair: Hablar de cursos derivados y cambio agregado; reservar destinos individuales como no verificados.
    status: bounded
  - id: D-09
    observed: El gate visual trataba 2500 palabras como techo rígido aunque el caso documentado agrega sustancia pública pertinente.
    impact: Un criterio de concisión podía bloquear evidencia útil sin detectar una falla metodológica o de UX.
    repair: Medir y reportar longitud como advertencia blanda; conservar como duros causalidad, paridad, accesibilidad, overflow y trazabilidad.
    status: repaired
  - id: D-10
    observed: El texto decía que la disponibilidad de resultados precedía toda selección, pero el algoritmo elige primero una familia educativa; Rancagua entra sin puntajes observables.
    impact: La explicación podía hacer parecer que ambos ejemplos sobrevivían por resultados observados.
    repair: Publicar el orden completo, declarar que los valores nunca intervienen y rotular la ausencia de puntajes en Rancagua.
    status: repaired
  - id: D-11
    observed: El visor podía mover verticalmente la página al activar un tab y quedaba inerte si fallaba el módulo o WebGL.
    impact: La experiencia degradaba navegación y accesibilidad aunque la ruta principal cargara bien.
    repair: Centrar tabs solo con scroll horizontal y ofrecer fallback estático no interactivo en ambos fallos.
