invariants:
  - id: INV-01
    rule: ES y EN conservan cifras, límites, visuales y significado equivalentes.
  - id: INV-02
    rule: NOT_ESTIMABLE no significa cero, empate ni ausencia de efecto.
  - id: INV-03
    rule: Cercanía, trayectoria y rotación contable no identifican causalidad.
  - id: INV-04
    rule: Anexos, sucesiones de identidad y segmentos educacionales no se cuentan como cierres comparables.
  - id: INV-05
    rule: El Salvador no altera los dos mapas seleccionados sistemáticamente; se rotula como caso propuesto por el autor y queda fuera de esa muestra.
  - id: INV-06
    rule: Menor matrícula se presenta como causa solo con respaldo documental; la serie por sí sola acredita una tendencia.
  - id: INV-07
    rule: El ancho adicional rige solo para Post II desde 64em; móvil conserva la composición existente y cero desborde horizontal.
  - id: INV-08
    rule: El commit local requiere autoridad explícita; push, despliegue y difusión requieren autorizaciones posteriores separadas.
  - id: INV-09
    rule: La meta de 2500 palabras es una señal editorial flexible; contenido trazable puede excederla sin reprobar gates duros.
  - id: INV-10
    rule: Cada figura nombra su fuente sustantiva; INE para demografía y MINEDUC para directorios, matrícula y resultados.
  - id: INV-11
    rule: La prosa conserva una medida máxima de 72ch en escritorio; visuales, tablas y notas técnicas pueden usar el ancho ampliado.
  - id: INV-12
    rule: Un diseño rechazado por falta de soporte sintético no acredita efecto cero ni ausencia de efecto SLEP.
  - id: INV-13
    rule: Los estimandos exploratorios SAE con intervalos que incluyen cero no acreditan efecto nulo ni causalidad identificada.
  - id: INV-14
    rule: La ausencia de capacidad predictiva SLEP distinguible del azar no acredita calendario exógeno ni ausencia de selección no observada.
  - id: INV-15
    rule: Una regla fijada en la especificación no se denomina preespecificada o preregistrada sin custodia temporal independiente anterior a la estimación.

