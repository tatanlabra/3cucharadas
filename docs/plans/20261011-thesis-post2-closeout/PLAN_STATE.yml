  - id: D-18
    observed: Siete PNG, un SVG y cinco recibos derivados no reproducen los bytes históricos en este host, aunque dos corridas locales producen 51 de 51 archivos idénticos.
    impact: El freeze acopla transitivamente evidencia científica a métricas tipográficas y a la portabilidad del entorno visual.
    repair: Mantener la deuda explícita, no prometer reproducción byte a byte entre entornos y fijar el entorno o desplazar el freeze a datos antes de una futura renovación visual.
