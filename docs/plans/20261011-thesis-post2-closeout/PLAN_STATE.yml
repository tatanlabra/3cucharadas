  - id: D-16
    observed: El freeze aceptaba mutaciones causales de su diccionario de claims porque solo validaba estructura y campos seleccionados.
    impact: Una prosa causal podía conservar etiquetas no causales y pasar los validadores científicos.
    repair: Exigir igualdad exacta con el diccionario canónico y conservar una sonda SRF-014 que fue verde antes de la reparación y roja después.
