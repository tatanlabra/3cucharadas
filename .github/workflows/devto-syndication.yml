name: Sindicación dev.to (borrador)

# Fase 4.3 (archivo/handoffs/difusion/HANDOFF-2026-07-25-distribucion-3cucharadas.md).
# Solo actúa sobre posts EN marcados `sindicar: true` + `valor_seo: bajo|medio`
# en su front matter, y siempre publica como borrador en dev.to. Sin el
# secreto DEV_TO_API_KEY configurado en este repo, scripts/syndicate_devto.rb
# no hace nada (ver el script): el workflow puede vivir aquí sin activar
# sindicación real hasta que alguien configure el secreto deliberadamente.

on:
  push:
    branches:
      - main
    paths:
      - "_posts/*-en.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin llamar a la API de dev.to"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: devto-syndication
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      # Pinneado a SHA de commit, no a etiqueta. Este es el único workflow del
      # repositorio que combina `contents: write`, un secreto (DEV_TO_API_KEY) y
      # un `git push` de vuelta a `main`, y además dispara solo al hacer push. Una
      # etiqueta como `@v4` es móvil: quien controle el repositorio de la acción
      # puede reapuntarla y ejecutar código nuevo con ese secreto y ese permiso de
      # escritura, sin que aquí cambie una línea. El SHA no se puede reapuntar.
      # Dependabot (.github/dependabot.yml) es quien propone subirlo.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Ejecutar sindicación
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          DEVTO_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ruby scripts/syndicate_devto.rb

      - name: Commit del registro de distribución si cambió
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git diff --quiet -- _data/distribucion.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/distribucion.yml
            git commit -m "chore(distribucion): registra sindicación dev.to automatizada"
            git push
          else
            echo "Sin cambios en _data/distribucion.yml"
          fi
