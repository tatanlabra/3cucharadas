name: Sindicación dev.to (borrador)

# Fase 4.3 (archivo/handoffs/difusion/HANDOFF-2026-07-25-distribucion-3cucharadas.md).
# Procesa posts EN con `distribution.republish: [dev]`; `sindicar: true` queda
# solo como alias heredado. Un artículo nuevo se crea como borrador y uno ya
# registrado se actualiza sin cambiar su estado publicado. Sin el secreto
# DEV_TO_API_KEY, scripts/syndicate_devto.rb no hace llamadas externas.

on:
  push:
    branches:
      - main
    paths:
      - "_posts/*-en.md"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin llamar a la API de dev.to"
        type: boolean
        default: false
      backlog:
        # El script omite todo post con mas de 21 dias, para no crear de golpe un
        # articulo por cada entrada antigua la primera vez que alguien configura la
        # clave. Esa guarda es correcta por defecto y no habia forma de levantarla:
        # el disparo manual no exponia la bandera, asi que un post viejo que uno SI
        # quiere sindicar quedaba fuera para siempre. Ahora se pide explicitamente.
        description: "Sindicar tambien posts fuera de la ventana de 21 dias"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: devto-syndication
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      # Pinneado a SHA de commit, no a etiqueta. Este es el único workflow del
      # repositorio que combina `contents: write`, un secreto (DEV_TO_API_KEY) y
      # un `git push` de vuelta a `main`, y además dispara solo al hacer push. Una
      # etiqueta como `@v4` es móvil: quien controle el repositorio de la acción
      # puede reapuntarla y ejecutar código nuevo con ese secreto y ese permiso de
      # escritura, sin que aquí cambie una línea. El SHA no se puede reapuntar.
      # Dependabot (.github/dependabot.yml) es quien propone subirlo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Ejecutar sindicación
        env:
          DEV_TO_API_KEY: ${{ secrets.DEV_TO_API_KEY }}
          DEVTO_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: ruby scripts/syndicate_devto.rb ${{ inputs.backlog && '--backlog' || '' }}

      - name: Commit del registro de distribución si cambió
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git diff --quiet -- _data/distribucion.yml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/distribucion.yml
            git commit -m "chore(distribucion): registra sindicación dev.to automatizada"
            git push
          else
            echo "Sin cambios en _data/distribucion.yml"
          fi
