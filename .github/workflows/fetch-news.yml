name: Fetch news feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Este workflow solo tiene `contents: read` y es manual, así que el pinning
      # no lo exige AC-SEC-03. Se hace igual por consistencia: mantener una sola
      # convención evita que la próxima acción con permisos de escritura se copie
      # de aquí con una etiqueta móvil.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install feedparser

      - name: Fetch RSS feeds → _data/feedly_news.json
        run: python scripts/fetch_news.py
