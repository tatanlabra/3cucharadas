name: Deploy GitHub Pages redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

# Acciones pinneadas a SHA de commit. Este workflow tiene `pages: write` e
# `id-token: write`: puede publicar en GitHub Pages y pedir un token OIDC a
# nombre del repositorio. Con una etiqueta móvil, un compromiso del repositorio
# de la acción se convierte en control del sitio redirector y del token, sin
# cambiar nada aquí. Los SHA se resolvieron contra el upstream real (`gh api
# repos/<owner>/<repo>/commits/<tag>`) y corresponden exactamente a las majors
# que ya usaba el archivo: no se cambió ninguna versión, solo la forma de
# referenciarla.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redirector branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages-redirect
          path: _site_redirect

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Remove Git metadata from artifact
        run: rm -rf _site_redirect/.git

      - name: Upload redirector artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site_redirect

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy redirector
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
