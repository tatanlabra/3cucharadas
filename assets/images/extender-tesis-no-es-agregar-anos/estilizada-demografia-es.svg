<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Menos población en edad escolar: una presión que ya viene en camino</title>
  <desc id="figure-desc">Serie nacional de población de 6 a 17 años, índice 2025 igual a 100. Las estimaciones terminan en 2024 y las proyecciones comienzan en 2025.</desc>
  <defs>
    <pattern id="projection-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#b8ff3c" stroke-width="3" opacity="0.24"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, "Inter var", system-ui, sans-serif; }
    .title { fill: #f4f7fb; font-size: 32px; font-weight: 760; letter-spacing: -0.4px; }
    .subtitle { fill: #b8c2d6; font-size: 16px; }
    .label { fill: #f4f7fb; font-size: 16px; }
    .small { fill: #b8c2d6; font-size: 14px; }
    .tiny { fill: #b8c2d6; font-size: 12px; }
    .number { fill: #f4f7fb; font-size: 22px; font-weight: 760; font-variant-numeric: tabular-nums; }
    .kicker { fill: #37e7ff; font-size: 13px; font-weight: 750; letter-spacing: 1.4px; }
    .map-title { fill: #f4f7fb; font-size: 40px; font-weight: 780; letter-spacing: -0.5px; }
    .map-label { fill: #b8c2d6; font-size: 18px; }
    .map-small { fill: #b8c2d6; font-size: 16px; }
    .map-value { fill: #f4f7fb; font-size: 34px; font-weight: 780; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="1200" height="720" rx="24" fill="#10121d"/>
  <text class="kicker" x="72" y="64">POST II · PRESIÓN DEMOGRÁFICA</text>
  <text class="title" x="72" y="110">Menos población en edad escolar: una presión que ya viene en camino</text>
  <text class="subtitle"><tspan x="72" y="140">Serie nacional de población de 6 a 17 años, índice 2025 igual a 100. Las estimaciones terminan en 2024 y las</tspan><tspan x="72" y="162">proyecciones comienzan en 2025.</tspan></text>
