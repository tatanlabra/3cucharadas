  <title id="figure-title">Admisión: las entradas no alcanzan soporte inferencial</title>
  <desc id="figure-desc">Trayectorias nacionales de pruebas de admisión, estandarizadas dentro de cada régimen. Las cruces son celdas descriptivas sin soporte inferencial suficiente.</desc>
