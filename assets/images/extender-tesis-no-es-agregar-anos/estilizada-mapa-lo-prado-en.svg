<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">Closures anchored in Lo Prado and nearby compatible entries</title>
  <desc id="figure-desc">School map using official coordinates for Lo Prado. Crosses are closures and plus signs are compatible openings; lines show the proximity match, not student destinations.</desc>
  <defs>
