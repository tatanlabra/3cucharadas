<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Caso real agregado de tesis: A/B Codex con y sin política Nushell</title>
  <desc id="desc">Treinta ejecuciones. Ambos brazos acertaron cinco de cinco en cada una de tres tareas. La política activó Nushell cinco de cinco veces en las dos tareas estructuradas y cero de cinco veces en el límite conceptual.</desc>
  <style>
    .bg{fill:#121521} .panel{fill:#1b2032;stroke:#2a3041;stroke-width:2} text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#e8ecf5} .eyebrow{font-size:18px;letter-spacing:2px;fill:#37e7ff;font-weight:700} .title{font-size:31px;font-weight:700} .sub{font-size:17px;fill:#aeb8ca} .head{font-size:15px;fill:#aeb8ca;font-weight:700} .task{font-size:16px;font-weight:650} .arm{font-size:16px} .ok{font-size:18px;fill:#b8ff3c;font-weight:700} .nu{font-size:18px;fill:#37e7ff;font-weight:700} .metric{font-size:16px;fill:#aeb8ca} .note{font-size:15px;fill:#aeb8ca} .rule{stroke:#2a3041;stroke-width:1}
  </style>
  <rect class="bg" width="1200" height="700" rx="20"/>
  <text x="72" y="72" class="eyebrow">CASO REAL · AGREGADOS PÚBLICOS · 30 EJECUCIONES</text>
  <text x="72" y="120" class="title">La política cumple la ruta; no prueba que Nushell gane</text>
  <text x="72" y="154" class="sub">Codex read-only · razonamiento low · 3 tareas × 2 brazos × 5 repeticiones</text>
  <rect x="52" y="188" width="1096" height="414" rx="14" class="panel"/>
  <text x="72" y="214" class="head">TAREA</text><text x="500" y="214" class="head">BRAZO</text><text x="660" y="214" class="head">ACIERTO</text><text x="790" y="214" class="head">USÓ NU</text><text x="920" y="214" class="head">MEDIANA</text>
  <line x1="72" x2="1128" y1="226" y2="226" class="rule"/>
  <text x="72" y="234" class="task">R1 · ranking sobre agregados válidos</text><text x="500" y="234" class="arm">Sin Nu</text><text x="660" y="234" class="ok">5/5</text><text x="790" y="234" class="nu">0/5</text><text x="920" y="234" class="metric">30.6 s · 445 tok</text><text x="72" y="294" class="task"></text><text x="500" y="294" class="arm">Política Nu</text><text x="660" y="294" class="ok">5/5</text><text x="790" y="294" class="nu">5/5</text><text x="920" y="294" class="metric">42.0 s · 580 tok</text><text x="72" y="362" class="task">R2 · fixture corrupto: bloquear ranking</text><text x="500" y="362" class="arm">Sin Nu</text><text x="660" y="362" class="ok">5/5</text><text x="790" y="362" class="nu">0/5</text><text x="920" y="362" class="metric">31.4 s · 358 tok</text><text x="72" y="422" class="task"></text><text x="500" y="422" class="arm">Política Nu</text><text x="660" y="422" class="ok">5/5</text><text x="790" y="422" class="nu">5/5</text><text x="920" y="422" class="metric">32.0 s · 410 tok</text><text x="72" y="490" class="task">R3 · límite conceptual: no inferir cierre</text><text x="500" y="490" class="arm">Sin Nu</text><text x="660" y="490" class="ok">5/5</text><text x="790" y="490" class="nu">0/5</text><text x="920" y="490" class="metric">15.0 s · 88 tok</text><text x="72" y="550" class="task"></text><text x="500" y="550" class="arm">Política Nu</text><text x="660" y="550" class="ok">5/5</text><text x="790" y="550" class="nu">0/5</text><text x="920" y="550" class="metric">11.4 s · 62 tok</text>
  <text x="72" y="648" class="note">R1/R2: la política pidió Nu y se observó 5/5. R3: no lo pidió y se observó 0/5.</text>
  <text x="72" y="675" class="note">Caso único; sin inferencia poblacional, p-valor ni claim de rendimiento general.</text>
</svg>
