# .gitlab-ci.yml — Jekyll 4.x + Minimal Mistakes (gem-based) → GitLab Pages
#
# Este pipeline construye el artefacto que se publica en producción. Todo lo que
# entra aquí termina servido desde 3cucharadas.cl, así que cada descarga externa
# se fija: la imagen base por digest y el tarball de Node por SHA256 declarado en
# este archivo. Antes se instalaba Node con `curl … | bash -` desde NodeSource,
# que ejecutaba un script remoto como root sin verificar nada: un compromiso de
# ese proveedor —o de la ruta hasta él— inyectaba código arbitrario en `public/`
# sin dejar rastro en el repositorio.
#
# `ruby:3.3` es una etiqueta flotante: el mismo commit construía con una imagen
# distinta cada semana. Fijar el digest hace el build reproducible y convierte
# cualquier cambio de base en un cambio versionado y revisable. El costo es que
# el digest hay que refrescarlo a mano cuando se quieran los parches de Debian
# o de Ruby (ver docs/security/threat-model.md).
image: ruby:3.3@sha256:81c61dc8558e6df057cb389cca2b511134427b4b0391c71b0d4d71460776890d

variables:
  JEKYLL_ENV: "production"
  BUNDLE_PATH: "vendor/bundle"
  BUNDLE_DEPLOYMENT: "true"
  GIT_DEPTH: "50"   # mitiga rate limits y acelera fetch
  # Debe seguir a `.nvmrc` y a `engines.node` de package.json. Los SHA256 son los
  # publicados por nodejs.org en https://nodejs.org/dist/v24.18.0/SHASUMS256.txt
  # y se copian aquí a propósito: verificar contra el SHASUMS256.txt descargado en
  # el mismo momento no prueba nada, porque quien pueda alterar el tarball también
  # puede alterar la lista. El valor fijado en el repositorio es el que sí es
  # revisable en un diff.
  NODE_VERSION: "24.18.0"
  NODE_SHA256_X64: "55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742"
  NODE_SHA256_ARM64: "58c9520501f6ae2b52d5b210444e24b9d0c029a58c5011b797bc1fe7105886f6"

cache:
  paths:
    - vendor/bundle

stages:
  - build
  - deploy

build_site:
  stage: build
  script:
    - ruby -v
    - apt-get update -y
    # `xz-utils` lo necesita `tar -J` para el tarball oficial de Node.
    - apt-get install -y --no-install-recommends ca-certificates curl python3 python3-pip python3-venv xz-utils
    # Node desde el binario oficial de nodejs.org, verificado contra el SHA256
    # fijado arriba. Se elige el tarball —y no un repositorio APT de terceros—
    # porque es el único camino en que la integridad de lo que se ejecuta queda
    # anclada a un valor versionado en este repositorio: si el archivo remoto
    # cambia, `sha256sum -c` falla y el job se detiene antes de construir nada.
    - |
      set -eu
      case "$(dpkg --print-architecture)" in
        amd64) node_arch="x64";   node_sha256="$NODE_SHA256_X64" ;;
        arm64) node_arch="arm64"; node_sha256="$NODE_SHA256_ARM64" ;;
        *)
          echo "ERROR: arquitectura $(dpkg --print-architecture) sin SHA256 declarado en .gitlab-ci.yml" >&2
          exit 1
          ;;
      esac
      node_tarball="node-v${NODE_VERSION}-linux-${node_arch}.tar.xz"
      curl -fsSL --proto "=https" --tlsv1.2 -o "/tmp/${node_tarball}" "https://nodejs.org/dist/v${NODE_VERSION}/${node_tarball}"
      echo "${node_sha256}  /tmp/${node_tarball}" | sha256sum -c -
      tar -xJf "/tmp/${node_tarball}" -C /usr/local --strip-components=1 --no-same-owner \
        --exclude CHANGELOG.md --exclude LICENSE --exclude README.md
      rm -f "/tmp/${node_tarball}"
    - node --version
    - npm --version
    - npm ci
    - npm run check:catastro
    - npm run test:catastro
    - npm run build:catastro
    - npm run check:memoria-gobernada
    - npm run test:memoria-gobernada
    - npm run build:memoria-gobernada
    - npm run check:memoria-gobernada:assets
    - python3 -m venv .venv
    - .venv/bin/pip install feedparser
    - .venv/bin/python scripts/fetch_news.py
    - gem install bundler -N
    - bundle install
    # Corre sobre el árbol fuente, antes de construir: si un post referencia una
    # imagen inexistente o una pieza no publicable, falla acá y no tras el build.
    - ruby scripts/verify_visual_assets.rb
    - bundle exec jekyll build -d public
    - ruby scripts/verify_site_artifact.rb public
    - ruby scripts/verify_distribution_readiness.rb public
    - bundle exec jekyll build --future -d .future-check
    - ruby scripts/verify_site_artifact.rb .future-check
    - bundle exec jekyll build --drafts --future -d .draft-math-check
    - VERIFY_MATH_DRAFTS=1 ruby scripts/verify_site_artifact.rb .draft-math-check
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'

pages:
  stage: deploy
  dependencies: [build_site]
  script:
    - echo "Publishing to GitLab Pages…"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
